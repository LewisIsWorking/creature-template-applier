name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Prose, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      # module.json names these files. If the build emits other names, Foundry loads nothing, silently.
      - name: Build output matches the manifest
        run: |
          test -f dist/creature-template-applier.js
